services:
  arcane:
    image: ghcr.io/getarcaneapp/arcane:latest
    container_name: arcane
    restart: unless-stopped
    env_file:
      - ../.env.global
    ports:
      - "3552:3552"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ../../config/infra/arcane/data:/app/data
      - ../../stacks:/app/data/projects
    environment:
      - APP_URL=http://localhost:3552
      - ENCRYPTION_KEY=${ARCANE_ENCRYPTION_KEY}
      - JWT_SECRET=${ARCANE_JWT_SECRET}
      - DATABASE_URL=file:data/arcane.db?_pragma=journal_mode(WAL)&_pragma=busy_timeout(2500)&_txlock=immediate
    labels:
      - com.getarcaneapp.arcane.updater=false

  dashy:
    image: lissy93/dashy:latest
    container_name: dashy
    ports:
      - 8080:8080
    volumes:
      - ../../config/infra/dashy/user-data:/app/user-data
    environment:
      - NODE_ENV=production
    restart: unless-stopped

networks:
  default:
    name: homelab-net
