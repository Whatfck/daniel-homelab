services:
  adguardhome:
    image: adguard/adguardhome:latest
    container_name: adguardhome
    restart: unless-stopped
    # Puertos para DNS, Admin UI, etc.
    ports:
      - 53:53/tcp
      - 53:53/udp
      - 3001:3000/tcp # Instalación inicial
      - 8000:80/tcp   # Admin UI después de instalar
      - 444:443/tcp
    volumes:
      - ../../config/home/adguard/work:/opt/adguardhome/work
      - ../../config/home/adguard/conf:/opt/adguardhome/conf
    networks:
      - homelab-net

  homeassistant:
    image: lscr.io/linuxserver/home-assistant:latest
    container_name: homeassistant
    restart: unless-stopped
    network_mode: host # Recomendado para descubrimiento de dispositivos
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=America/Bogota
    volumes:
      - ../../config/home/homeassistant:/config
    # Nota: Home Assistant suele usar el puerto 8123

networks:
  homelab-net:
    external: true
