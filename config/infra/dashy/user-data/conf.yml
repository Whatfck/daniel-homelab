appConfig:
  theme: default
  layout: auto
  iconSize: medium
  language: es
  statusCheck: true
  statusCheckInterval: 20
  statusCheckAllowInsecure: true
  externalStyleSheet: 'https://fonts.googleapis.com/css2?family=Farsan&display=swap'
  customColors:
    default:
      primary: '#bb86fc'
      background: '#121212'
      background-darker: '#1e1e1e'
  customCss: |
    :root {
      --curve-factor: 12px;
      --curve-factor-navbar: 20px;
      --item-shadow: 0 4px 6px rgba(0, 0, 0, 0.3);
      --item-hover-shadow: 0 8px 16px rgba(187, 134, 252, 0.3);
      --item-icon-transform: drop-shadow(2px 2px 4px rgba(0,0,0,0.3)) saturate(1.2);
      --item-icon-transform-hover: drop-shadow(4px 4px 8px rgba(187, 134, 252, 0.4)) saturate(1.5) scale(1.05);
    }

    /* Global Font and Texture */
    body, html, #app {
      font-family: 'Farsan', cursive !important;
      background-color: #121212 !important;
      background-image: repeating-linear-gradient(45deg, transparent, transparent 35px, rgba(187, 134, 252, 0.03) 35px, rgba(187, 134, 252, 0.03) 70px) !important;
      background-attachment: fixed !important;
      min-height: 100vh;
    }

    /* Header Styling */
    .home-heading {
      background: linear-gradient(135deg, #bb86fc 0%, #3700b3 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      font-weight: 700;
      font-size: 3.2rem;
      margin-bottom: 0.5rem;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 15px;
    }

    .home-heading::before {
      content: '⚡';
      -webkit-text-fill-color: initial; /* Para que el icono tenga su color original o el definido abajo */
      color: #bb86fc;
      font-size: 3rem;
      filter: drop-shadow(0 0 10px rgba(187, 134, 252, 0.6));
      animation: pulse 2s ease-in-out infinite;
    }

    @keyframes pulse {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.1); }
    }
    
    .home-sub-heading {
      opacity: 0.7;
      letter-spacing: 3px;
      font-size: 0.85rem;
      text-transform: uppercase;
      font-weight: 500;
    }
    
    /* Footer Styling */
    footer {
      background: linear-gradient(to right, rgba(0,0,0,0.1), rgba(0,0,0,0.3), rgba(0,0,0,0.1));
      border-top: 1px solid rgba(187, 134, 252, 0.2);
      padding: 1.5rem;
      backdrop-filter: blur(10px);
    }
    
    footer::before {
      content: '';
      display: block;
      width: 80px;
      height: 2px;
      background: linear-gradient(to right, transparent, #bb86fc, transparent);
      margin: 0 auto 1rem;
    }

