appConfig:
  theme: default
  layout: auto
  iconSize: medium
  language: es
  statusCheck: true
  statusCheckInterval: 20
  statusCheckAllowInsecure: true
  externalStyleSheet: 'https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;700&display=swap'
  customColors:
    default:
      primary: '#bb86fc'
      background: '#09090b'
      background-darker: '#121214'
      text-main: '#ffffff'
  customCss: |
    :root {
      --curve-factor: 20px;
      --accent-color: #bb86fc;
      --accent-glow: rgba(187, 134, 252, 0.4);
      --glass-bg: rgba(18, 18, 22, 0.6);
      --glass-border: rgba(255, 255, 255, 0.05);
    }

    /* Iconos Estrictamente Cuadrados */
    .item-icon, .item-inner img, .icon, .service-icon, .tile-icon {
      border-radius: 0 !important;
      -webkit-mask-image: none !important;
      mask-image: none !important;
    }

    /* Secciones y Tarjetas con Curvas */
    .section-main {
      border-radius: var(--curve-factor) !important;
    }

    .item-inner {
      border-radius: 12px !important;
    }

    /* Fondo Global con Malla Tecnológica */
    body, html, #app {
      font-family: 'Outfit', sans-serif !important;
      background-color: #09090b !important;
      background-image: 
        linear-gradient(rgba(187, 134, 252, 0.03) 1px, transparent 1px),
        linear-gradient(90deg, rgba(187, 134, 252, 0.03) 1px, transparent 1px),
        radial-gradient(at 0% 0%, rgba(187, 134, 252, 0.08) 0px, transparent 50%),
        radial-gradient(at 100% 100%, rgba(55, 0, 179, 0.1) 0px, transparent 50%);
      background-size: 30px 30px, 30px 30px, 100% 100%, 100% 100%;
      background-attachment: fixed !important;
      min-height: 100vh;
    }

    /* Estilo del Header */
    .home-heading {
      font-family: 'Outfit', sans-serif !important;
      letter-spacing: -2px;
      background: linear-gradient(135deg, #fff 30%, #bb86fc 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      font-weight: 800;
      font-size: 4rem;
      margin-top: 2rem;
    }

    /* Secciones Estilo Glass Refinado */
    .section-main {
      background: rgba(18, 18, 22, 0.6) !important;
      backdrop-filter: blur(16px) saturate(180%) !important;
      border: 1px solid rgba(255, 255, 255, 0.05) !important;
      border-radius: 24px !important;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5) !important;
      border-top: 1px solid rgba(187, 134, 252, 0.2) !important;
    }

    .section-title {
      font-weight: 700 !important;
      color: #bb86fc !important;
      text-transform: uppercase;
      letter-spacing: 2px;
      font-size: 0.9rem !important;
      opacity: 0.9;
    }

    /* Tarjetas */
    .item-inner {
      background: rgba(255, 255, 255, 0.02) !important;
      border: 1px solid rgba(255, 255, 255, 0.03) !important;
      transition: all 0.5s cubic-bezier(0.23, 1, 0.32, 1) !important;
    }

    .item-inner:hover {
      background: rgba(187, 134, 252, 0.08) !important;
      border-color: rgba(187, 134, 252, 0.4) !important;
      box-shadow: 0 15px 35px rgba(0,0,0,0.6) !important;
    }

    /* Iconos Cuadrados */
    .item-icon, .item-inner img {
      border-radius: 0 !important;
      filter: drop-shadow(0 4px 8px rgba(0,0,0,0.5)) !important;
      transition: transform 0.3s ease !important;
    }

    .item-inner:hover .item-icon {
      transform: rotate(5deg) scale(1.1);
    }

    /* Indicadores de Estado Reubicados */
    .item-inner {
      position: relative !important;
      border-radius: 8px !important; /* Tarjetas ligeramente redondeadas pero iconos rectos */
    }

    .status-indicator {
      position: absolute !important;
      top: 10px !important;
      right: 10px !important;
      border-radius: 0 !important; /* Punto de estado cuadrado también */
      width: 6px !important;
      height: 6px !important;
      margin: 0 !important;
      box-shadow: none !important;
      z-index: 10;
    }

    /* Scrollbar Personalizada */
    ::-webkit-scrollbar {
      width: 8px;
    }
    ::-webkit-scrollbar-track {
      background: #09090b;
    }
    ::-webkit-scrollbar-thumb {
      background: #1e1e24;
      border-radius: 10px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: #bb86fc;
    }

    /* Footer */
    footer {
      border: none !important;
      font-weight: 300;
      letter-spacing: 1px;
    }

